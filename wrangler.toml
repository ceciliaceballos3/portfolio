name = "portfolio"
compatibility_date = "2025-01-01"
# Only the shop goes through the Worker (the password gate); everything else is
# served straight from the static build. See docs/shop.md.
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/illustration/shop", "/illustration/shop/*", "/illustration/shop.*"]
