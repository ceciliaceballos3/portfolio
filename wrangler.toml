name = "portfolio"
compatibility_date = "2025-01-01"
# Only the illustration section goes through the Worker (the password gate); everything else is
# served straight from the static build. See docs/shop.md.
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/illustration", "/illustration/*", "/illustration.*"]

[vars]
# "false" opens the shop to everyone; anything else keeps it password-protected
# (SHOP_PASSWORD, a dashboard secret) and hides it from the header and sitemap.
# The build reads this too, so changing it means a commit and a rebuild.
# See docs/shop.md.
SHOP_PASSWORD_REQUIRED = "true"
